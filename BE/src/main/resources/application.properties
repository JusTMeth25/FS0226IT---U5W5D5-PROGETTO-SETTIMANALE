spring.application.name=demo

# Credenziali DB in env.properties (non committato, vedi env.properties.example)
spring.config.import=file:env.properties

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload
# Limite globale = documenti (20MB); le foto hanno il loro limite di 10MB in ImageValidator
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=105MB
# Permette di rispondere 413 anche quando la richiesta supera i limiti
server.tomcat.max-swallow-size=-1
app.upload.dir=uploads
app.upload.max-files=5

# Documenti del profilo (cartella privata, non servita come statico)
app.documenti.dir=documenti
app.documenti.max-files=5

# OCR con Tess4J. tessdata del progetto (eng + ita); alternativa: C:/Program Files/Tesseract-OCR/tessdata
app.ocr.tessdata-path=tessdata
app.ocr.lingue=ita+eng
app.ocr.dpi=300
app.ocr.max-pagine=30
# Sotto questa soglia una pagina PDF è considerata scansionata e passa all'OCR
app.ocr.min-caratteri-pagina=20
app.ocr.thread=2

# Geocoding (Google Geocoding API v4) - chiave in env.properties
app.geocoding.base-url=${GEOCODING_BASE_URL:https://geocode.googleapis.com}
app.geocoding.api-key=${GOOGLE_API_KEY:}
app.geocoding.region-code=IT
app.geocoding.language-code=it
app.geocoding.max-results=5

# CORS
app.cors.allowed-origin=http://localhost:5173
